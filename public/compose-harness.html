<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>compose area · shortcode strip</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { margin: 0; padding: 80px 20px; background: #e8e8e8; font-family: sans-serif; }
        compose-area { display: block; width: 520px; }
        .bar { display: flex; align-items: center; gap: 8px; background: #fff; padding: 10px; }
        .composearea { flex: 1; outline: 0; min-height: 20px; font-size: 15px; }
        #log { margin-top: 24px; width: 520px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
<compose-area>
    <div>
        <div class="bar">
            <span>📎</span>
            <div class="composearea" contenteditable="true"></div>
            <span>🙂</span>
        </div>
    </div>
</compose-area>
<div id="log"></div>

<script type="module">
import init, {ComposeArea} from './node_modules/@threema/compose-area/web/compose_area.js';

const log = (...a) => {
    document.getElementById('log').textContent += a.join(' ') + '\n';
};

await init('./node_modules/@threema/compose-area/web/compose_area_bg.wasm');

const wrapper = document.querySelector('compose-area');
const div = document.querySelector('.composearea');
const composeArea = ComposeArea.bind_to(div);

// --- the pieces copied verbatim from compose_area.ts --------------------
const SUGGESTION_LIMIT = 12;
let strip = null;
let suggestions = [];
let suggestionIndex = 0;

const SAMPLE = [
    ['joy', '1f602'], ['smile', '1f604'], ['smiley', '1f603'], ['grin', '1f601'],
    ['grinning', '1f600'], ['clown_face', '1f921'], ['tomato', '1f345'],
];
const nameToEmoji = new Map(SAMPLE.map(([n, cp]) => [n, String.fromCodePoint(parseInt(cp, 16))]));
const emojify = (emoji) => {
    const cp = [...emoji].map((c) => c.codePointAt(0).toString(16)).join('-');
    return '<img class="em" draggable="false" alt="' + emoji + '" src="emoji/img/' + cp + '.png" data-c="' + cp + '">';
};

function hideSuggestions() {
    if (strip !== null) { strip.remove(); strip = null; }
    suggestions = [];
    suggestionIndex = 0;
}

function insertSuggestion(shortname) {
    log('INSERT', shortname);
    window.__inserted = shortname;
    hideSuggestions();
}

function renderSuggestions() {
    if (strip === null) {
        strip = document.createElement('div');
        strip.className = 'emoji-suggestions';
        wrapper.appendChild(strip);
    }
    strip.innerHTML = '';
    suggestions.forEach((shortname, at) => {
        const item = document.createElement('span');
        item.className = 'suggestion' + (at === suggestionIndex ? ' selected' : '');
        item.innerHTML = emojify(nameToEmoji.get(shortname));
        item.title = ':' + shortname + ':';
        item.addEventListener('mousedown', (ev) => {
            ev.preventDefault();
            insertSuggestion(shortname);
        });
        strip.appendChild(item);
    });
}

function updateSuggestions() {
    const word = composeArea.get_word_at_caret();
    if (word === undefined) { log('word: undefined'); hideSuggestions(); return; }
    const typed = word.before() + word.after();
    log('word at caret: ' + JSON.stringify(typed));
    if (!typed.startsWith(':') || (typed.length > 1 && typed.endsWith(':'))) {
        hideSuggestions();
        return;
    }
    const needle = typed.slice(1).toLowerCase();
    suggestions = SAMPLE.map(([n]) => n).filter((n) => n.startsWith(needle)).slice(0, SUGGESTION_LIMIT);
    if (suggestions.length === 0) { hideSuggestions(); return; }
    suggestionIndex = 0;
    renderSuggestions();
}

function onKeyDown(ev) {
    if (suggestions.length > 0) {
        switch (ev.key) {
            case 'ArrowRight':
                ev.preventDefault();
                suggestionIndex = (suggestionIndex + 1) % suggestions.length;
                renderSuggestions();
                return;
            case 'ArrowLeft':
                ev.preventDefault();
                suggestionIndex = (suggestionIndex - 1 + suggestions.length) % suggestions.length;
                renderSuggestions();
                return;
            case 'Tab':
            case 'Enter':
                ev.preventDefault();
                insertSuggestion(suggestions[suggestionIndex]);
                return;
            case 'Escape':
                ev.preventDefault();
                hideSuggestions();
                return;
            default: break;
        }
    }
}

div.addEventListener('keydown', onKeyDown);
div.addEventListener('keyup', () => updateSuggestions());
document.addEventListener('selectionchange', () => composeArea.store_selection_range());

window.__state = () => ({
    strip: strip !== null,
    count: suggestions.length,
    index: suggestionIndex,
    names: suggestions,
});
window.__ready = true;
log('ready');
</script>
</body>
</html>
